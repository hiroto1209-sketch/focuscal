name: Verify FocusCal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: focuscal-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check peek.js
          node --check enhancements.js
          node --check ui-polish-v57.js
          node --check peek-calendar-v58.js
          node --check peek-appearance-live-v58.js
          node --check peek-cell-style-v59.js
          node --check feedback-v60.js
          node --check admin-dashboard.js
          node --check src/v70/auto-planner.js
          node --check src/v70/account.js
          node --check src/v70/collaboration.js
          node --check src/v70/notifications.js
          node --check src/v70/observability.js
          node --check src/v76/feature-menu.js
          node --check functions/index.js
          node --check sw.js
          node --check scripts/verify-focuscal.mjs
      - name: Build integrity smoke test
        run: node scripts/verify-focuscal.mjs
      - name: v79 feature menu contract
        run: |
          grep -q "const BUILD='79'" index.html
          grep -q "const BUILD='79'" src/v76/feature-menu.js
          grep -q "origin.id==='fab-party'" src/v76/feature-menu.js
          grep -q "pointerdown" src/v76/feature-menu.js
          grep -q "touchstart" src/v76/feature-menu.js
          grep -q "touchend" src/v76/feature-menu.js
          grep -q "650" src/v76/feature-menu.js
          grep -q "fc-v79-open" src/v76/feature-menu.js
          grep -q "transition-delay:calc(var(--i,0) \* 32ms)" src/v76/feature-menu.js
          grep -q "fab-fit" src/v76/feature-menu.js
          grep -q "fab-book" src/v76/feature-menu.js
          grep -q "fab-party" src/v76/feature-menu.js
          grep -q "origin.click()" src/v76/feature-menu.js
          ! grep -q "英語フレーズを追加" src/v76/feature-menu.js
          ! grep -q "中国語フレーズを追加" src/v76/feature-menu.js
          grep -q "focuscal-v79-longpress-safe-menu" sw.js
      - name: Core v70 contracts
        run: |
          grep -q "findSlot" src/v70/auto-planner.js
          grep -q "linkWithPopup" src/v70/account.js
          grep -q "spaceEvents" src/v70/collaboration.js
          grep -q "getToken" src/v70/notifications.js
          grep -q "clientErrors" src/v70/observability.js
          grep -q "productEvents" src/v70/observability.js
          grep -q "clusterStats" admin-dashboard.js
      - name: Firebase and security contracts
        run: |
          grep -q "match /spaces/{spaceId}" firestore.rules
          grep -q "match /spaceEvents/{eventId}" firestore.rules
          grep -q "match /pushTokens/{uid}" firestore.rules
          grep -q "match /clientErrors/{id}" firestore.rules
          grep -q "match /productEvents/{id}" firestore.rules
          grep -q "match /feedback/{feedbackId}" firestore.rules
          grep -q "match /admins/{uid}" firestore.rules
          if grep -q "allow read, write: if true" firestore.rules; then echo "Unsafe Firestore rule"; exit 1; fi
      - name: Existing sharing and feedback regression checks
        run: |
          grep -q "リアルタイム共有に接続済み" peek.js
          grep -q "peekVisibility!=='private'" peek-cell-style-v59.js
          grep -q "collection(db,'feedback')" feedback-v60.js
          test -f admin.html
          test -f ops.html
