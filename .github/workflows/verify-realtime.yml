name: Verify realtime boot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check peek.js
          node --check enhancements.js
          node --check sw.js
      - name: Realtime boot wiring
        run: |
          test -f app.html
          grep -q "app.html?v=" index.html
          grep -q "firebase-config.js?v=" index.html
          grep -q "peek.js?v=" index.html
          grep -q "enhancements.js?v=" index.html
          grep -q "FOCUSCAL_FIREBASE_CONFIG" firebase-config.js
          grep -q "リアルタイム共有に接続済み" peek.js
          if grep -q "リアルタイム共有は準備済みです" peek.js; then exit 1; fi
      - name: Holiday and sheet gestures
        run: |
          grep -q "fc_holidays_enabled" enhancements.js
          grep -q "振替休日" enhancements.js
          grep -q "国民の休日" enhancements.js
          grep -q "holiday2026_0506" enhancements.js
          grep -q "holiday2026_0922" enhancements.js
          grep -q "holiday2027_0322" enhancements.js
          grep -q "fc-peek-dragging" enhancements.js
          grep -q "peek-close" enhancements.js
          grep -q "focuscal-v56-holidays-gestures" sw.js
      - name: Firestore contract
        run: |
          grep -q "match /events/{eventId}" firestore.rules
          grep -q "match /peekRequests/{requestId}" firestore.rules
          grep -q "match /peekPermissions/{permission}" firestore.rules
