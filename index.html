<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#09090f">
<title>FocusCal</title>
<style>html,body{margin:0;background:#09090f;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;min-height:100%}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}#boot b{display:block;font-size:18px;margin-bottom:8px}#boot small{color:#777}</style>
</head>
<body>
<div id="boot"><div><b>FocusCalを起動しています</b><small>v58 · realtime mirrored calendar</small></div></div>
<script>
(async()=>{
  const BUILD='58';
  try{
    const res=await fetch('./app.html?v='+BUILD,{cache:'no-store'});
    if(!res.ok) throw new Error('app.html '+res.status);
    let html=await res.text();
    html=html
      .replace(/<script[^>]*src=["']\.\/firebase-config\.js[^"']*["'][^>]*><\/script>/gi,'')
      .replace(/<script[^>]*src=["']\.\/peek(?:-v\d+)?\.js[^"']*["'][^>]*><\/script>/gi,'')
      .replace(/<script[^>]*src=["']\.\/enhancements\.js[^"']*["'][^>]*><\/script>/gi,'')
      .replace(/<script[^>]*src=["']\.\/ui-polish-v57\.js[^"']*["'][^>]*><\/script>/gi,'')
      .replace(/<script[^>]*src=["']\.\/peek-calendar-v58\.js[^"']*["'][^>]*><\/script>/gi,'')
      .replace(/<script[^>]*src=["']\.\/peek-appearance-live-v58\.js[^"']*["'][^>]*><\/script>/gi,'');
    const boot=`<script>window.FOCUSCAL_BOOT_BUILD='${BUILD}';<\/script><script src="./firebase-config.js?v=${BUILD}"><\/script><script src="./peek.js?v=${BUILD}"><\/script><script defer src="./enhancements.js?v=${BUILD}"><\/script><script defer src="./ui-polish-v57.js?v=${BUILD}"><\/script><script defer src="./peek-calendar-v58.js?v=${BUILD}"><\/script><script defer src="./peek-appearance-live-v58.js?v=${BUILD}"><\/script>`;
    html=html.replace('</head>',boot+'</head>');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('FocusCal boot failed',err);
    document.getElementById('boot').innerHTML='<div><b>起動に失敗しました</b><small>ページを再読み込みしてください</small></div>';
  }
})();
</script>
</body>
</html>
