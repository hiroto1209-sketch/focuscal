name: Verify FocusCal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: focuscal-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check peek.js
          node --check enhancements.js
          node --check ui-polish-v57.js
          node --check feedback-v60.js
          node --check admin-dashboard.js
          node --check src/v70/account.js
          node --check src/v70/collaboration.js
          node --check src/v70/notifications.js
          node --check src/v70/observability.js
          node --check src/v76/feature-menu.js
          node --check src/v82/year-wrap.js
          node --check src/v88/faithful-peek.js
          node --check functions/index.js
          node --check sw.js
          node --check scripts/verify-focuscal.mjs
      - name: Build integrity smoke test
        run: node scripts/verify-focuscal.mjs
      - name: v88 canonical faithful peek contract
        run: |
          grep -q "const BUILD='88'" index.html
          grep -q "src/v88/faithful-peek.js?v=" index.html
          grep -q "const BUILD='88'" src/v88/faithful-peek.js
          grep -q "mirrorV88" src/v88/faithful-peek.js
          grep -q "ownerUid:auth.currentUser.uid" src/v88/faithful-peek.js
          grep -q "canonical-single-renderer" src/v88/faithful-peek.js
          grep -q "protectRenderer" src/v88/faithful-peek.js
          grep -q "localWeekStart" src/v88/faithful-peek.js
          grep -q "hexBg" src/v88/faithful-peek.js
          grep -q "fx-neon" src/v88/faithful-peek.js
          grep -q "fx-sparkle" src/v88/faithful-peek.js
          grep -q "fx-rainbow" src/v88/faithful-peek.js
          grep -q "fx-fire" src/v88/faithful-peek.js
          grep -q "fx-glitch" src/v88/faithful-peek.js
          grep -q "fx-aurora" src/v88/faithful-peek.js
          grep -q "focuscal-v88-canonical-faithful-peek" sw.js
          ! grep -q '<script defer src="./peek-calendar-v58.js' index.html
          ! grep -q '<script defer src="./peek-cell-style-v59.js' index.html
          ! grep -q '<script defer src="./src/v85/peek-share-refinement.js' index.html
          ! grep -q '<script defer src="./src/v87/faithful-peek.js' index.html
          ! grep -q '<script defer src="./src/v70/auto-planner.js' index.html
      - name: Unified sharing contract
        run: |
          grep -q "const BUILD='85'" src/v70/collaboration.js
          grep -q "共有・共同" src/v70/collaboration.js
          grep -q "fc-co-open-peek" src/v70/collaboration.js
          grep -q "const BUILD='85'" src/v76/feature-menu.js
          grep -q "共有・共同" src/v76/feature-menu.js
          grep -q "HIDDEN_ORIGINS" src/v76/feature-menu.js
      - name: v84 seamless month/year swipe contract
        run: |
          grep -q "const BUILD='84'" src/v82/year-wrap.js
          grep -q "pointerdown must not mutate" src/v82/year-wrap.js
          grep -q "if(!crossing)return" src/v82/year-wrap.js
          grep -q "currentSliderX" src/v82/year-wrap.js
          grep -q "snapshotBoundary" src/v82/year-wrap.js
          grep -q "animateCross" src/v82/year-wrap.js
          grep -q "transform .36s cubic-bezier(.32,.72,.33,1)" src/v82/year-wrap.js
          ! grep -q "pointerdown.*snapshotBoundary" src/v82/year-wrap.js
      - name: v50 FAB motion contract
        run: |
          grep -q "mode:'v50-native-fab'" src/v76/feature-menu.js
          grep -q "translateY(26px) scale(.4)" src/v76/feature-menu.js
          grep -q "rotate(135deg)" src/v76/feature-menu.js
          grep -q "fab-fit" src/v76/feature-menu.js
          grep -q "fab-book" src/v76/feature-menu.js
          grep -q "fab-party" src/v76/feature-menu.js
      - name: Collaboration contracts
        run: |
          grep -q "arrayUnion" src/v70/collaboration.js
          grep -q "arrayRemove" src/v70/collaboration.js
          grep -q "deleteSpace" src/v70/collaboration.js
          grep -q "deleteEvent" src/v70/collaboration.js
          grep -q "spaceMessages" src/v70/collaboration.js
          grep -q 'type=\"date\"' src/v70/collaboration.js
          grep -q 'type=\"time\"' src/v70/collaboration.js
          grep -q "sendMessage" src/v70/collaboration.js
      - name: Firebase and security contracts
        run: |
          grep -q "match /events/{eventId}" firestore.rules
          grep -q "match /spaces/{spaceId}" firestore.rules
          grep -q "match /spaceEvents/{eventId}" firestore.rules
          grep -q "match /spaceMessages/{messageId}" firestore.rules
          grep -q "match /feedback/{feedbackId}" firestore.rules
          if grep -q "allow read, write: if true" firestore.rules; then echo "Unsafe Firestore rule"; exit 1; fi
      - name: Existing sharing regression checks
        run: |
          grep -q "リアルタイム共有に接続済み" peek.js
          grep -q "collection(db,'feedback')" feedback-v60.js
