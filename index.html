<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#09090f">
<title>FocusCal</title>
<style>html,body{margin:0;background:#09090f;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;min-height:100%}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}#boot b{display:block;font-size:18px;margin-bottom:8px}#boot small{color:#777}</style>
</head>
<body>
<div id="boot"><div><b>FocusCalを起動しています</b><small>v92 · offline-first</small></div></div>
<script>
(async()=>{
  const BUILD='92';
  const APP='./app.html';
  const decorate=html=>{
    const patterns=['firebase-config.js','push-config.js','peek.js','enhancements.js','ui-polish-v57.js','peek-calendar-v58.js','peek-appearance-live-v58.js','peek-cell-style-v59.js','feedback-v60.js','src/v70/auto-planner.js','src/v70/account.js','src/v70/collaboration.js','src/v70/notifications.js','src/v70/observability.js','src/v71/action-menu.js','src/v72/header-cleanup.js','src/v76/feature-menu.js','src/v82/year-wrap.js','src/v85/peek-share-refinement.js','src/v87/faithful-peek.js','src/v88/faithful-peek.js','src/v89/faithful-peek.js','src/v90/faithful-peek-lite.js','src/v91/peek-visual-sync.js','src/v91/faithful-peek-lite.js'];
    patterns.forEach(p=>{const safe=p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(`<script[^>]*src=["']\\./${safe}[^"']*["'][^>]*><\\/script>`,'gi'),'')});
    const boot=`<script>window.FOCUSCAL_BOOT_BUILD='${BUILD}';window.FOCUSCAL_OFFLINE_FIRST=true;<\/script>\n<script src="./firebase-config.js?v=${BUILD}"><\/script>\n<script src="./push-config.js?v=${BUILD}"><\/script>\n<script src="./peek.js?v=${BUILD}"><\/script>\n<script defer src="./enhancements.js?v=${BUILD}"><\/script>\n<script defer src="./ui-polish-v57.js?v=${BUILD}"><\/script>\n<script defer src="./feedback-v60.js?v=${BUILD}"><\/script>\n<script defer src="./src/v70/account.js?v=${BUILD}"><\/script>\n<script defer src="./src/v70/collaboration.js?v=${BUILD}"><\/script>\n<script defer src="./src/v70/notifications.js?v=${BUILD}"><\/script>\n<script defer src="./src/v70/observability.js?v=${BUILD}"><\/script>\n<script defer src="./src/v76/feature-menu.js?v=${BUILD}"><\/script>\n<script defer src="./src/v82/year-wrap.js?v=${BUILD}"><\/script>\n<script defer src="./src/v91/peek-visual-sync.js?v=${BUILD}"><\/script>\n<script defer src="./src/v91/faithful-peek-lite.js?v=${BUILD}"><\/script>`;
    return html.replace('</head>',boot+'</head>');
  };
  try{
    let html='';
    if('caches' in window){const cached=await caches.match(APP);if(cached)html=await cached.text()}
    if(!html){const res=await fetch(APP,{cache:'default'});if(!res.ok)throw new Error('app.html '+res.status);html=await res.text()}
    document.open();document.write(decorate(html));document.close();
    if(navigator.onLine)fetch(APP,{cache:'no-store'}).then(async r=>{if(r.ok&&'caches' in window){const c=await caches.open('focuscal-v92-offline-first');await c.put(APP,r.clone())}}).catch(()=>{});
  }catch(err){console.error('FocusCal boot failed',err);document.getElementById('boot').innerHTML='<div><b>オフライン起動データがまだありません</b><small>通信できる状態でFocusCalを一度開くと、次回から機内モードでも起動できます。</small></div>'}
})();
</script>
</body>
</html>
