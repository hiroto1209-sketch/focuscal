<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090f"><title>FocusCal Product Health</title><style>:root{--bg:#09090f;--card:#13131f;--border:#292941;--text:#eeeeff;--muted:#777795;--accent:#8c68ff;--red:#ff6677}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#120925,#09090f 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}.wrap{max-width:980px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 18px 60px}.eyebrow{letter-spacing:.2em;color:#a78bfa;font-weight:850;font-size:.72rem}h1{font-size:2rem;margin:8px 0}.sub{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.stat,.card{border:1px solid var(--border);background:rgba(19,19,31,.88);border-radius:17px;padding:16px}.num{font-size:2rem;font-weight:850}.label{color:var(--muted);font-size:.68rem;margin-top:6px}.section{margin-top:18px}.section h2{font-size:.9rem}.row{border-top:1px solid var(--border);padding:11px 0}.row:first-child{border-top:0}.name{font-weight:800;font-size:.72rem}.meta,.msg{color:var(--muted);font-size:.6rem;line-height:1.6;word-break:break-word}.err{color:#ff9aa6}.gate{padding:18px;border:1px solid var(--border);border-radius:16px;margin-top:20px}.hidden{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style><script src="./firebase-config.js"></script></head><body><main class="wrap"><div class="eyebrow">FOCUSCAL · DEVELOPMENT</div><h1>Product Health</h1><div class="sub">ユーザー行動とエラーを見て、報告される前に改善する。</div><div id="gate" class="gate">管理者確認中…</div><div id="dash" class="hidden"><div class="grid"><div class="stat"><div class="num" id="s-events">0</div><div class="label">直近イベント</div></div><div class="stat"><div class="num" id="s-errors">0</div><div class="label">直近エラー</div></div><div class="stat"><div class="num" id="s-users">0</div><div class="label">アクティブUID</div></div><div class="stat"><div class="num" id="s-build">-</div><div class="label">最多Build</div></div></div><section class="card section"><h2>📈 よく使われている機能</h2><div id="event-list"></div></section><section class="card section"><h2>🚨 最近のクライアントエラー</h2><div id="error-list"></div></section></div></main><script type="module" src="./src/v70/ops-dashboard.js"></script></body></html>
